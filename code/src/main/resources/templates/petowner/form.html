<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ฟอร์มเจ้าของสัตว์เลี้ยง</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/pawcare.css}">
  <link rel="stylesheet" th:href="@{/css/icons.css}">
</head>
<body>
<!-- แถบเมนูด้านบน -->
<nav class="navbar">
  <a th:href="@{/}" class="brand">
    <span class="brand-logo"><span class="icon i-paw-print icon-white"></span></span>
    <span>PawCare<small>Pet Clinic &amp; Vaccination</small></span>
  </a>
  <div class="nav-links">
    <a th:href="@{/}">Home</a>
    <a th:href="@{/owners}" class="active">Owners</a>
    <a th:href="@{/pets}">My Pets</a>
    <a th:href="@{/appointments}">Appointments</a>
    <a th:href="@{/about}">About</a>
  </div>
</nav>

<main class="container section">
  <h1 class="text-navy" th:text="${isEdit} ? 'แก้ไขข้อมูลเจ้าของ' : 'เพิ่มเจ้าของสัตว์เลี้ยง'">ฟอร์ม</h1>

  <!-- error จาก Service เช่น อีเมลซ้ำ -->
  <div th:if="${errorMessage}" class="alert alert-warning" th:text="${errorMessage}"></div>

  <!-- isEdit = false -> POST /owners (เพิ่ม), isEdit = true -> POST /owners/{id} (แก้ไข) -->
    <!-- ใช้ทั้งเพิ่มและแก้ไข: ถ้าแก้ไขจะส่งไป /owners/{id} ถ้าเพิ่มใหม่จะส่งไป /owners -->
  <form class="card" method="post" th:object="${ownerRequest}"
        th:action="${isEdit} ? @{/owners/{id}(id=${ownerId})} : @{/owners}">

    <div class="grid grid-form">
      <div class="field">
        <label for="firstName">ชื่อจริง *</label>
        <input id="firstName" class="input" th:field="*{firstName}">
        <!-- แสดงข้อความ error จาก @NotBlank หรือ @Size ใน PetOwnerRequestDTO -->
        <small class="text-accent" th:if="${#fields.hasErrors('firstName')}" th:text="${#fields.errors('firstName')[0]}"></small>
      </div>
      <div class="field">
        <label for="lastName">นามสกุล *</label>
        <input id="lastName" class="input" th:field="*{lastName}">
        <small class="text-accent" th:if="${#fields.hasErrors('lastName')}" th:text="${#fields.errors('lastName')[0]}"></small>
      </div>
      <div class="field">
        <label for="email">อีเมล *</label>
        <input id="email" type="email" class="input" th:field="*{email}">
        <small class="text-accent" th:if="${#fields.hasErrors('email')}" th:text="${#fields.errors('email')[0]}"></small>
      </div>
      <div class="field">
        <label for="phone">เบอร์โทร *</label>
        <input id="phone" class="input" th:field="*{phone}" placeholder="0812345678">
        <small class="text-accent" th:if="${#fields.hasErrors('phone')}" th:text="${#fields.errors('phone')[0]}"></small>
      </div>
      <div class="field">
        <label for="emergencyContactName">ผู้ติดต่อฉุกเฉิน</label>
        <input id="emergencyContactName" class="input" th:field="*{emergencyContactName}">
      </div>
      <div class="field">
        <label for="emergencyContactPhone">เบอร์ฉุกเฉิน *</label>
        <input id="emergencyContactPhone" class="input" th:field="*{emergencyContactPhone}">
        <small class="text-accent" th:if="${#fields.hasErrors('emergencyContactPhone')}" th:text="${#fields.errors('emergencyContactPhone')[0]}"></small>
      </div>
    </div>
    <div class="field">
      <label for="address">ที่อยู่</label>
      <textarea id="address" class="textarea" rows="3" th:field="*{address}"></textarea>
    </div>

    <div class="row">
      <button type="submit" class="btn-primary"><span class="icon i-check"></span> บันทึก</button>
      <a th:href="@{/owners}" class="btn-secondary">ยกเลิก</a>
    </div>
  </form>
</main>
</body>
</html>
